# Project-level Supabase MCP server for DeepSeek Harness (dsh).
#
# dsh has no `.mcp.json`-style project config: an MCP server is a plugin entry,
# and a project contributes its own layer through the launcher's `--patch` flag:
#
#   dsh web --patch .dsh/mcp.supabase.patch.yml
#
# Effective layer order (later layers append/override):
#   bundle layers -> profile cordis.patch.yml -> $DSH_HOME/cordis.patch.yml -> --patch overlays
#
# Authentication: dsh's MCP client supports static request headers only, with no
# OAuth/dynamic-client-registration flow, so Supabase's default browser login is
# unavailable. Use a scoped personal access token (PAT) instead, exported in the
# environment that launches dsh. Create one at:
#   https://supabase.com/dashboard/account/tokens
#   export SUPABASE_ACCESS_TOKEN=sbp_...
#
# The entry stays inert (no connection attempt, no startup delay) until the token
# is present.
- insert:
    - id: mcp-supabase
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.SUPABASE_ACCESS_TOKEN'
      config:
        # Model-facing tool prefix: mcp__supabase__<tool>
        serverName: supabase
        transport: streamable-http
        # 未加 read_only：DDL / 迁移等可写工具仍开放；要收紧见 .dsh/README.md
        url: 'https://mcp.supabase.com/mcp?project_ref=iehxleycijdqlglnfbby&features=docs%2Caccount%2Cdatabase%2Cdebugging%2Cdevelopment%2Cfunctions%2Cbranching'
        headers:
          Authorization: !!js '`Bearer ${process.env.SUPABASE_ACCESS_TOKEN ?? ""}`'
        # Never block harness startup when Supabase is unreachable.
        failOnStartupError: false
